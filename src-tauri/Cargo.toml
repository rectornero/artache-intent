[package]
name = "artache-intent"
version = "0.2.0"
description = "Artache Intent: a script editor that exports to Ren'Py and RPG Maker MV"
edition = "2021"

[lib]
name = "artache_intent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
