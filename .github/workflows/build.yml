name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: artache-intent-windows
          path: |
            src-tauri/target/release/artache-intent.exe
            src-tauri/target/release/bundle/nsis/*.exe

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      # The runner ships the Android SDK; add the NDK and the Android 16 SDK (API 36).
      - name: Install NDK and the Android 16 SDK (API 36)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.0.12077973" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Build debug APK (sideload; a signed release build needs a keystore secret)
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
        run: |
          npx tauri android init --ci
          # Target the latest Android (16, API 36); still installs on Android 7+ (minSdk 24).
          sed -i -E 's/(compileSdk|targetSdk) = [0-9]+/\1 = 36/' src-tauri/gen/android/app/build.gradle.kts
          grep -E "compileSdk|targetSdk|minSdk" src-tauri/gen/android/app/build.gradle.kts
          # Keep the app clear of the status bar and notch (edge to edge on Android 15+).
          MA=$(find src-tauri/gen/android/app/src/main -name MainActivity.kt | head -1)
          { grep -m1 '^package ' "$MA"; echo; cat src-tauri/android/MainActivity.kt; } > "$MA.new" && mv "$MA.new" "$MA"
          cat "$MA"
          # arm64 covers every current phone and keeps the APK small.
          npx tauri android build --apk --debug --ci --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: artache-intent-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # Every push to main refreshes one pre-release with the newest exe and APK,
  # so there is always a single download page.
  release:
    needs: [windows, android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist-artifacts }
      - name: Name the files
        run: |
          V=$(node -p "require('./package.json').version")
          echo "V=$V" >> "$GITHUB_ENV"
          mkdir out
          cp "$(find dist-artifacts/artache-intent-android -name '*.apk' | head -1)" "out/Artache-Intent-$V-android-arm64.apk"
          cp "$(find dist-artifacts/artache-intent-windows -path '*nsis*' -name '*.exe' | head -1)" "out/Artache-Intent-$V-windows-setup.exe"
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: Artache Intent ${{ env.V }}
          prerelease: true
          files: out/*
          body: Test build for Windows 10/11 (64-bit) and Android 7 to 16. The APK is a debug build for sideloading.
